[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insanlastir"
version = "0.1.0"
description = "Türkçe LLM çıktılarını daha doğal, insan yazımına yakın hale getiren kural tabanlı humanizer."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.104,<1.0",
    "uvicorn[standard]>=0.24,<1.0",
    "pyyaml>=6.0,<7.0",
    "zeyrek==0.1.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<8.0"]
llm = ["anthropic>=0.40,<1.0"]
semantic = ["sentence-transformers>=2.2,<4.0"]
# 1.11.0+ requires Python 3.9+; 1.10.1 son 3.8-uyumlu sürüm (bkz. plan Bölüm 50).
dependency = ["stanza>=1.5,<1.11.0"]

[project.scripts]
insanlastir = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]
