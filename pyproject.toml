[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turkish-humanizer"
version = "0.1.0"
description = "Türkçe LLM çıktılarını daha doğal, insan yazımına yakın hale getiren kural tabanlı humanizer (Faz 1)."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.104,<1.0",
    "uvicorn[standard]>=0.24,<1.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<8.0"]

[project.scripts]
turkish-humanizer = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]
